name: Generate

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write # Required to commit the regenerated output

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned exactly: protoc stamps its version into every generated file, so a
      # release bump rewrites the committed output. Moving this is a deliberate edit
      # whose header churn is reviewable on its own.
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      # protoc-gen-go and mage come from the tool directives in go.mod, so generation
      # runs the versions pinned there instead of whatever is latest today.
      - name: Generate Protobuf
        run: go tool mage proto

      # Also generates the internal/test fixtures. Their *.pb.go is committed; the
      # *.psrpc.go beside it is gitignored, built from this tree by protoc-gen-psrpc.
      - name: Generate test fixtures
        run: go tool mage generate

      - name: Add changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: '["internal", "testutils", "protoc-gen-psrpc/options"]'
          default_author: github_actions
          message: generated protobuf
