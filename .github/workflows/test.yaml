name: Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read # Only reads the checkout; setup-protoc's repo-token needs no more

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed even though generate.yaml owns the committed output: internal/test
      # gitignores **/*.psrpc.go, so the fixtures the tests compile against have to be
      # generated here before anything builds.
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      # testall regenerates the gitignored fixtures, then tests. Redis and NATS are
      # started by the tests themselves via dockertest.
      - name: Mage Test
        run: go tool mage testall
