syntax = "proto3";

package internal;
option go_package = "github.com/livekit/psrpc/internal";

import "google/protobuf/any.proto";

message Msg {
  string type_url = 1;
  bytes value = 2;
  string channel = 3;
  // Encoding of value.
  Compression compression = 4;
}

enum Compression {
  COMPRESSION_NONE = 0;
  COMPRESSION_GZIP = 1;
}

// Read view of Msg, minus channel. Field numbers must match Msg.
message Content {
  string type_url = 1;
  bytes value = 2;
  reserved 3;
  Compression compression = 4;
}

message Channel {
  string channel = 3;
}

message Request {
  string request_id = 1;
  string client_id = 2;
  int64 sent_at = 3;
  int64 expiry = 4;
  bool multi = 5;
  google.protobuf.Any request = 6;
  map<string, string> metadata = 7;
  bytes raw_request = 8;
  // 9 was the caller-elected skip, which older servers honor unconditionally.
  reserved 9;
  // 10 advertised that an announcement could replace the claim.
  reserved 10;
  // On a queue rpc, the caller needs no claim: it waits for the response until
  // expiry, and grants a bid from a server that sends one anyway. Older callers
  // need the bid.
  bool no_claim = 11;
  // The caller also listens on a response channel of this request's own, named
  // for the client ID with the request ID appended. A server that supports it
  // bids and responds there; older servers use the client's shared channels.
  bool per_request_reply = 12;
}

message Response {
  string request_id = 1;
  string server_id = 2;
  int64 sent_at = 3;
  google.protobuf.Any response = 4;
  string error = 5;
  string code = 6;
  bytes raw_response = 7;
  repeated google.protobuf.Any error_details = 8;
}

message ClaimRequest {
  string request_id = 1;
  string server_id = 2;
  float affinity = 3;
  // 4 announced that handling had begun and no ClaimResponse was awaited.
  reserved 4;
}

message ClaimResponse {
  string request_id = 1;
  string server_id = 2;
}

message Stream {
  string stream_id = 1;
  string request_id = 2;
  int64 sent_at = 3;
  int64 expiry = 4;
  oneof body {
    StreamOpen open = 6;
    StreamMessage message = 7;
    StreamAck ack = 8;
    StreamClose close = 9;
  }
}

message StreamOpen {
  string node_id = 1;
  map<string, string> metadata = 7;
}

message StreamMessage {
  google.protobuf.Any message = 1;
  bytes raw_message = 2;
}

message StreamAck {}

message StreamClose {
  string error = 1;
  string code = 2;
}
